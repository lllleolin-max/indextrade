name: wheel-and-application-pilot
on: [push, pull_request]
jobs:
  installed-wheel:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip wheel --no-deps --wheel-dir dist .
      - run: python -m pip install --no-index --find-links dist indextrade
      - name: Tests against installed bytes and actual CLI
        shell: python
        run: |
          import os, pathlib, subprocess, tempfile
          repository = pathlib.Path.cwd()
          env = os.environ.copy()
          env.pop('PYTHONPATH', None)
          with tempfile.TemporaryDirectory() as folder:
              subprocess.run(['python', '-c', 'import indextrade; print(indextrade.__file__)'], cwd=folder, env=env, check=True)
              subprocess.run(['python', '-m', 'unittest', 'discover', '-s', str(repository / 'tests'), '-v'], cwd=folder, env=env, check=True)
              subprocess.run(['indextrade', 'pilot', 'pilot', '--orders', '200'], cwd=folder, env=env, check=True, stdout=subprocess.DEVNULL)
              subprocess.run(['python', str(repository / 'examples/verify_proposal.py'), str(pathlib.Path(folder) / 'pilot/service.db'), str(pathlib.Path(folder) / 'pilot/advice')], cwd=folder, env=env, check=True)
